    <text x="28" y="35" fill="#5EEAD4" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="700">deep</text>
    <text x="28" y="64" fill="#E5E7EB" font-family="Inter, ui-sans-serif, system-ui" font-size="17">high-risk decisions</text>

      Cognitive Coalition
    </text>
    <text x="0" y="96" fill="#BAE6FD" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="600" letter-spacing="0">

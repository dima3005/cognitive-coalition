    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="44" fill="url(#bg)"/>
  <circle cx="232" cy="122" r="178" fill="#22D3EE" opacity="0.18" filter="url(#blurGlow)"/>
  <circle cx="1050" cy="500" r="230" fill="#8B5CF6" opacity="0.16" filter="url(#blurGlow)"/>
  <circle cx="720" cy="320" r="270" fill="#14B8A6" opacity="0.08" filter="url(#blurGlow)"/>

  <path d="M0 520C164 470 282 500 424 536C606 582 778 612 960 548C1102 498 1190 426 1280 438V640H0V520Z" fill="#FFFFFF" opacity="0.035"/>
  <path d="M0 100C160 142 292 122 430 80C606 26 774 12 954 84C1108 146 1190 206 1280 184" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <g filter="url(#shadow)">
